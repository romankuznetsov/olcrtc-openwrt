#!/bin/sh
# netifd protocol handler for olcRTC.
#
# Installed as /lib/netifd/proto/olcrtc.sh. Registering here is what makes the
# tunnel a real interface: it appears under Network -> Interfaces in LuCI, the
# Start / Stop / Restart buttons work with no extra code, and `ifup olcrtc` /
# `ifdown olcrtc` behave normally.
#
# Data path:
#   olcrtc0 (TUN) -> hev-socks5-tunnel -> olcRTC SOCKS5 -> WebRTC -> VPS
#
# Both daemons are supervised as one unit by /usr/libexec/olcrtc-link, run
# under proto_run_command. netifd restarts the pair if either dies, and
# teardown kills both -- so Stop in LuCI genuinely stops the tunnel rather than
# leaving a conference session open.

. /lib/functions.sh
. /lib/netifd/netifd-proto.sh
init_proto "$@"

OLC_RUNDIR=/var/run/olcrtc
OLC_SHARE=/usr/share/olcrtc
OLC_UID=8808

proto_olcrtc_init_config() {
	available=1
	# We create the TUN device ourselves, so netifd must not expect one to
	# exist beforehand.
	no_device=1

	proto_config_add_string  "provider"
	proto_config_add_string  "room"
	proto_config_add_string  "transport"
	proto_config_add_string  "key_file"
	proto_config_add_int     "socks_port"
	proto_config_add_string  "tun_addr"
	proto_config_add_int     "mtu"
	proto_config_add_string  "dns_addr"
	proto_config_add_boolean "block_quic"
	proto_config_add_boolean "block_ipv6"
	proto_config_add_boolean "default_route"
	proto_config_add_int     "metric"
}

# Can uid/gid 8808 read this file? Parses `ls -ln` because busybox on OpenWrt
# provides neither `su` nor `stat`.
#
# ls -ln output:  -rw-r-----  1  0  8808  65  <date>  <path>
#                 ^perms         ^uid ^gid
# perms columns:  1 type, 2-4 owner, 5-7 group, 8-10 other.
_key_readable() {
	local perms uid gid
	# shellcheck disable=SC2046
	set -- $(ls -ln "$1" 2>/dev/null)
	[ -n "${1:-}" ] || return 1
	perms="$1"; uid="$3"; gid="$4"

	# world-readable (permissive, but readable)
	[ "$(echo "$perms" | cut -c8)" = "r" ] && return 0
	# group-readable and owned by the service group
	[ "$(echo "$perms" | cut -c5)" = "r" ] && [ "$gid" = "$OLC_UID" ] && return 0
	# owned by the service user and owner-readable
	[ "$(echo "$perms" | cut -c2)" = "r" ] && [ "$uid" = "$OLC_UID" ] && return 0
	return 1
}

# A readable file inside a directory the service account cannot traverse is
# still unreachable, and the error names the file rather than the directory.
# Checking the file alone therefore reports a false OK.
_dir_traversable() {
	local perms gid
	# shellcheck disable=SC2046
	set -- $(ls -ldn "$1" 2>/dev/null)
	[ -n "${1:-}" ] || return 1
	perms="$1"; gid="$4"
	[ "$(echo "$perms" | cut -c10)" = "x" ] && return 0
	[ "$(echo "$perms" | cut -c7)" = "x" ] && [ "$gid" = "$OLC_UID" ] && return 0
	return 1
}

_render_olcrtc_yaml() {
	# olcRTC config. The key is referenced by path, never inlined, so the
	# secret does not land in UCI, in LuCI's form state, or in a config
	# backup taken with `sysupgrade -b`.
	cat > "$1" <<EOF
# generated by /lib/netifd/proto/olcrtc.sh -- edits are overwritten on ifup
mode: cnc

auth:
  provider: $provider

room:
  id: "$room"

crypto:
  key_file: "$key_file"

net:
  transport: $transport
  dns: "$dns_addr"

liveness:
  interval: 10s
  timeout: 15s
  failures: 4

socks:
  host: "127.0.0.1"
  port: $socks_port
  user: ""
  pass: ""

debug: false
EOF
	chmod 0600 "$1"
}

_render_hev_yaml() {
	# hev-socks5-tunnel config.
	#
	# ipv6 is deliberately OMITTED: the tunnel is IPv4-only, and giving the
	# TUN an IPv6 address would attract traffic it cannot carry.
	#
	# icmp is 'off' because ICMP cannot traverse a SOCKS5 CONNECT either.
	#
	# udp is 'udp' only because the key is mandatory. olcRTC rejects both
	# UDP ASSOCIATE and the hev UDP-in-TCP extension, so UDP fails whatever
	# is set here -- the firewall rejects it up front so it fails fast
	# instead of hanging until timeout.
	#
	# No pid-file: omitting it keeps the process in the foreground, which is
	# what proto_run_command needs in order to supervise it.
	cat > "$1" <<EOF
# generated by /lib/netifd/proto/olcrtc.sh -- edits are overwritten on ifup
tunnel:
  name: $2
  mtu: $mtu
  multi-queue: false
  ipv4: $tun_addr
  icmp: 'off'

socks5:
  address: 127.0.0.1
  port: $socks_port
  udp: 'udp'

misc:
  log-level: warn
  limit-nofile: 8192
EOF
}

proto_olcrtc_setup() {
	local cfg="$1"
	local iface="olcrtc0"

	json_get_vars provider room transport key_file socks_port tun_addr mtu \
	              dns_addr block_quic block_ipv6 default_route metric

	# Defaults. Kept here rather than only in the LuCI form so a
	# hand-written /etc/config/network entry works too.
	[ -n "$provider" ]   || provider="jitsi"
	[ -n "$transport" ]  || transport="datachannel"
	[ -n "$key_file" ]   || key_file="/etc/olcrtc/olcrtc.key"
	[ -n "$socks_port" ] || socks_port=8808
	[ -n "$tun_addr" ]   || tun_addr="198.18.0.1"
	[ -n "$mtu" ]        || mtu=8500
	[ -n "$dns_addr" ]   || dns_addr="127.0.0.1:5053"
	[ -n "$metric" ]     || metric=10

	if [ -z "$room" ]; then
		echo "olcrtc: 'room' is not set" >&2
		proto_notify_error "$cfg" MISSING_ROOM
		proto_block_restart "$cfg"
		return 1
	fi

	if [ ! -r "$key_file" ]; then
		echo "olcrtc: key file '$key_file' missing or unreadable" >&2
		proto_notify_error "$cfg" MISSING_KEY
		proto_block_restart "$cfg"
		return 1
	fi

	# A key that the service account cannot read fails at runtime with a
	# confusing error, so check it here where the message is useful.
	#
	# Done by parsing `ls -ln` rather than the obvious `su olcrtc -c test -r`:
	# OpenWrt's busybox ships neither `su` nor `stat` by default, so that form
	# fails unconditionally and would block the interface from ever starting.
	if ! _dir_traversable "$(dirname "$key_file")"; then
		echo "olcrtc: directory '$(dirname "$key_file")' is not traversable by the olcrtc user" >&2
		echo "olcrtc: fix with: chgrp olcrtc '$(dirname "$key_file")' && chmod 0750 '$(dirname "$key_file")'" >&2
		proto_notify_error "$cfg" KEY_DIR_PERMISSIONS
		proto_block_restart "$cfg"
		return 1
	fi

	if ! _key_readable "$key_file"; then
		echo "olcrtc: key file '$key_file' is not readable by the olcrtc user" >&2
		echo "olcrtc: fix with: chgrp olcrtc '$key_file' && chmod 0640 '$key_file'" >&2
		proto_notify_error "$cfg" KEY_PERMISSIONS
		proto_block_restart "$cfg"
		return 1
	fi

	if [ ! -c /dev/net/tun ]; then
		modprobe tun 2>/dev/null
		if [ ! -c /dev/net/tun ]; then
			echo "olcrtc: /dev/net/tun missing -- install kmod-tun" >&2
			proto_notify_error "$cfg" NO_TUN
			proto_block_restart "$cfg"
			return 1
		fi
	fi

	# root:olcrtc, not root:root. A config file chowned to the service
	# account is still unreachable if the directory above it cannot be
	# traversed, and the failure reads as "permission denied" on the file,
	# which sends you looking in the wrong place.
	mkdir -p "$OLC_RUNDIR"
	chown "root:$OLC_UID" "$OLC_RUNDIR" 2>/dev/null
	chmod 0750 "$OLC_RUNDIR"
	local olc_yaml="$OLC_RUNDIR/olcrtc-$cfg.yaml"
	local hev_yaml="$OLC_RUNDIR/hev-$cfg.yaml"

	_render_olcrtc_yaml "$olc_yaml"
	chown olcrtc "$olc_yaml" 2>/dev/null
	_render_hev_yaml "$hev_yaml" "$iface"

	# Loop prevention. olcRTC's own traffic to the conferencing service must
	# use the main table, or it is routed into the tunnel it is building.
	# Keyed on uid rather than destination because the service addresses are
	# dynamic and change on failover.
	ip rule del uidrange "$OLC_UID-$OLC_UID" lookup main pref 100 2>/dev/null
	if ! ip rule add uidrange "$OLC_UID-$OLC_UID" lookup main pref 100 2>/dev/null; then
		echo "olcrtc: 'ip rule uidrange' unsupported; falling back to fwmark" >&2
		# Fallback for kernels/iproute2 without uidrange. The nftables rule
		# that sets this mark ships in the firewall include.
		ip rule del fwmark 0x8808 lookup main pref 100 2>/dev/null
		ip rule add fwmark 0x8808 lookup main pref 100 2>/dev/null
	fi

	proto_export "INTERFACE=$cfg"
	proto_run_command "$cfg" /usr/libexec/olcrtc-link \
		"$olc_yaml" "$hev_yaml" "$iface" "$socks_port"

	# olcrtc-link creates the TUN via hev-socks5-tunnel; wait for it to
	# appear before handing the device to netifd. Without this, netifd is
	# told about a device that does not exist yet and the interface flaps.
	local i=0
	while [ $i -lt 60 ]; do
		[ -d "/sys/class/net/$iface" ] && break
		sleep 1
		i=$((i + 1))
	done

	if [ ! -d "/sys/class/net/$iface" ]; then
		echo "olcrtc: $iface did not appear within 60s" >&2
		proto_notify_error "$cfg" NO_DEVICE
		return 1
	fi

	proto_init_update "$iface" 1
	proto_add_ipv4_address "$tun_addr" 32
	if [ "${default_route:-1}" = 1 ]; then
		# 0.0.0.0/1 + 128.0.0.0/1 rather than a real default route: it
		# outranks the WAN default without replacing it, so the main table
		# still resolves the conferencing service for the uid-exempted
		# daemon.
		proto_add_ipv4_route "0.0.0.0" 1 "" "" "$metric"
		proto_add_ipv4_route "128.0.0.0" 1 "" "" "$metric"
	fi
	proto_send_update "$cfg"

	# Leak prevention. Applied after the interface is up so the rules never
	# exist without the tunnel behind them.
	/usr/libexec/olcrtc-link --firewall-up "$iface" \
		"${block_quic:-1}" "${block_ipv6:-1}"
}

proto_olcrtc_teardown() {
	local cfg="$1"
	local iface="olcrtc0"

	/usr/libexec/olcrtc-link --firewall-down "$iface"

	ip rule del uidrange "$OLC_UID-$OLC_UID" lookup main pref 100 2>/dev/null
	ip rule del fwmark 0x8808 lookup main pref 100 2>/dev/null

	proto_kill_command "$cfg"

	rm -f "$OLC_RUNDIR/olcrtc-$cfg.yaml" "$OLC_RUNDIR/hev-$cfg.yaml"
}

add_protocol olcrtc
